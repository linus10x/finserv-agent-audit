name: tmp resolve constraints

# Temporary. Resolves the CI extras from scratch so ci/constraints-ci.txt can be
# regenerated. Removed from the branch before the PR is merged.

on:
  push:
    branches: [profile-tuner/constraints-refresh-2026-10]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Resolve with uv
        run: |
          python -m pip install --upgrade pip uv
          for v in 3.12 3.13; do
            uv pip compile pyproject.toml \
              --extra dev --extra api --extra all-agentic --extra mcp --extra otel --extra test-property \
              --python-version "$v" --python-platform x86_64-unknown-linux-gnu \
              --no-header --no-annotate -o "resolved-$v.txt"
            echo "=== RESOLVED $v BEGIN"
            cat "resolved-$v.txt"
            echo "=== RESOLVED $v END"
          done
          echo "=== DIFF 3.12 vs 3.13"
          diff resolved-3.12.txt resolved-3.13.txt || true
