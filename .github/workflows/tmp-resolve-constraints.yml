name: tmp resolve constraints

# Temporary. Resolves the CI extras from scratch so ci/constraints-ci.txt can be
# regenerated. Removed from the branch before the PR is merged.

on:
  push:
    branches: [profile-tuner/constraints-refresh-2026-10]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Resolve with uv
        run: |
          python -m pip install --upgrade pip uv
          cat > floor.txt <<'EOF'
          pytest>=9.1.1
          pytest-cov>=7.1.0
          mypy>=2.2.0
          ruff>=0.15.21
          pre-commit>=4.6.0
          hypothesis>=6.156.5
          mcp>=1.26.0
          opentelemetry-api>=1.42.1
          opentelemetry-sdk>=1.42.1
          a2a-sdk>=1.1.0
          langgraph>=1.2.9
          crewai>=1.15.2
          fastapi>=0.138.0
          uvicorn>=0.51.0
          httpx>=0.28.1
          cryptography>=50.0.2
          agent-framework>=1.20.0
          agent-framework-core>=1.20.0
          posthog>=7.62.0
          agent-framework-github-copilot>=2.0.1
          agent-framework-a2a>=1.0.0b261002
          agent-framework-ag-ui>=1.5.0
          agent-framework-anthropic>=1.0.0b261002
          agent-framework-azure-ai-search>=1.0.0b261002
          agent-framework-azure-contentunderstanding>=1.0.0b261002
          agent-framework-azure-cosmos>=1.0.0b261002
          agent-framework-azurefunctions>=1.0.0b260922
          agent-framework-bedrock>=1.0.0b261002
          agent-framework-chatkit>=1.0.0b261002
          agent-framework-claude>=1.0.0b261002
          agent-framework-copilotstudio>=1.0.0b261002
          agent-framework-declarative>=1.2.0
          agent-framework-devui>=1.0.0b261002
          agent-framework-durabletask>=1.0.0b260922
          agent-framework-foundry>=1.14.0
          agent-framework-foundry-hosting>=1.0.0b261002
          agent-framework-foundry-local>=1.0.0b260730
          agent-framework-gemini>=1.0.0b261002
          agent-framework-hyperlight>=1.0.0b261002
          agent-framework-mem0>=1.0.0b261002
          agent-framework-mistral>=1.0.0b260918
          agent-framework-monty>=1.0.0b261002
          agent-framework-ollama>=1.0.0b261002
          agent-framework-openai>=1.15.0
          agent-framework-orchestrations>=1.3.0
          agent-framework-purview>=1.0.0b261002
          agent-framework-redis>=1.0.0b261002
          agent-framework-tools>=1.0.0b261002
          EOF
          sed -i 's/^ *//' floor.txt
          X="--extra dev --extra api --extra all-agentic --extra mcp --extra otel --extra test-property"
          for v in 3.12 3.13; do
            echo "=== A $v BEGIN"
            uv pip compile pyproject.toml $X -c floor.txt --python-version "$v" --python-platform x86_64-unknown-linux-gnu --no-header --no-annotate 2>&1 || echo "A $v FAILED"
            echo "=== A $v END"
            echo "=== B $v BEGIN"
            uv pip compile pyproject.toml floor.txt $X --python-version "$v" --python-platform x86_64-unknown-linux-gnu --no-header --no-annotate 2>&1 || echo "B $v FAILED"
            echo "=== B $v END"
          done
